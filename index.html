<h1>Kyytipalvelu</h1>

<p>Rooli:</p>

<button id="roolitarvitsija">Kyydin tarvitsija</button>
<button id="roolitarjoaja">Kyydin tarjoaja</button>

<br><br>

<input
    id="maaranpaa"
    type="text"
    placeholder="Anna määränpää"
    size="30"
    oninput="document.getElementById('tallennanappi').disabled = (this.value == '')"
>

<button
    id="tallennanappi"
    onclick="naytaMaaranpaa()"
    disabled
>
    Tallenna määränpää
</button>

<br><br>

<button
    id="luonappi"
    onclick="luoKyytipyynto()"
    disabled
>
    Luo kyytipyyntö
</button>

<button
    id="poistanappi"
    onclick="peruKyytipyynto()"
    disabled
>
    Poista kyytipyyntö
</button>

<hr>

<h2>Kyytipyyntöni</h2>

<p id="kyytipyynto">Ei aktiivista kyytipyyntöä</p>

<p id="kyytiSaapunut"></p>

<p id="valittumaaranpaa"></p>

<p><b>Sijaintisi:</b></p>

<p id="sijainti">Haetaan sijaintia...</p>

<p id="viimeksipaivitetty"></p>

<label for="autonTuntomerkki">
    Auton tuntomerkki:
</label>

<br>

<input
    id="autonTuntomerkki"
    type="text"
    placeholder="Anna autosi tuntomerkki"
>

<br><br>

<label for="tarjoajanMaaranpaa">
    Oma määränpää:
</label>

<br>

<input
    id="tarjoajanMaaranpaa"
    type="text"
    placeholder="Anna oma määränpää"
>

<br><br>

<p id="tarjoajanKoordinaatit"></p>

<p id="reittiAB"></p>

<p id="reittiACDB"></p>

<button
    id="aloitatarjoaminen"
    onclick="aloitaTarjoaminen()"
>
    Aloita kyydin tarjoaminen
</button>

<button
    id="lopetatarjoaminen"
    onclick="lopetaTarjoaminen()"
    disabled
>
    Lopeta kyydin tarjoaminen
</button>

<p id="tarjoajantila">
    En tarjoa kyytiä
</p>

<p id="lahellaolevatpyynnot">
    Lähellä olevat kyytipyynnöt: 0
</p>

<p id="havaittukyytipyynto"></p>

<button id="hyvaksyyyyti" disabled>
    Ota matkustaja kyytiin
</button>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

import {
    getFirestore,
    addDoc,
    collection,
    deleteDoc,
    doc,
    onSnapshot,
    updateDoc,
    query,
    where
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyCRvr7AuJEp_bQzaXQo506Y2CQfArewjtM",
    authDomain: "kyytipalvelu-c03b1.firebaseapp.com",
    projectId: "kyytipalvelu-c03b1",
    storageBucket: "kyytipalvelu-c03b1.firebasestorage.app",
    messagingSenderId: "1087195218441",
    appId: "1:1087195218441:web:2731bd7fea44daa316eed8"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

console.log("Firebase OK");


/*
 * Käyttäjän nykyinen GPS-sijainti
 *
 * Sama GPS-sijainti toimii käyttäjän roolin mukaan joko
 * matkustajan lähtöpaikkana tai tarjoajan nykyisenä sijaintina.
 */

var kayttajanNykyinenSijaintiTeksti = "";

var kayttajanNykyinenLatitude = null;

var kayttajanNykyinenLongitude = null;


/*
 * Matkustajan tiedot
 */

var kyytipyyntoAktiivinen = false;

var matkustajanMaaranpaa = "";

var matkustajanMaaranpaaLatitude = null;

var matkustajanMaaranpaaLongitude = null;


/*
 * Tarjoajan tiedot
 */

var tarjoaKyytia = false;

var tarjoaminenAloitettu = "";

var autonTuntomerkki = "";

var tarjoajanMaaranpaa = "";

var tarjoajanMaaranpaaLatitude = null;

var tarjoajanMaaranpaaLongitude = null;


/*
 * Firestore-kuuntelijoiden ja dokumentin tunnisteet
 */

var firestoreKyytipyyntoId = "";

var unsubscribeKyytipyynnot = null;

var unsubscribeOmaKyyti = null;

var reittiABMatkaKm = null;
var reittiABAikaMin = null;


/*
 * GPS-sijainnin seuranta
 */

navigator.geolocation.watchPosition(

    function(sijainti) {

        kayttajanNykyinenLatitude =
            sijainti.coords.latitude;

        kayttajanNykyinenLongitude =
            sijainti.coords.longitude;

        kayttajanNykyinenSijaintiTeksti =
            kayttajanNykyinenLatitude +
            ", " +
            kayttajanNykyinenLongitude;

        document.getElementById(
            "sijainti"
        ).innerHTML =
            "Leveysaste: " +
            kayttajanNykyinenLatitude +
            "<br>Pituusaste: " +
            kayttajanNykyinenLongitude;

        document.getElementById(
            "viimeksipaivitetty"
        ).innerHTML =
            "Viimeksi päivitetty: " +
            new Date().toLocaleTimeString();

    },

    function(virhe) {

        document.getElementById(
            "sijainti"
        ).innerHTML =
            virhe.message;

    }

);


/*
 * Matkustajan määränpään tallentaminen
 */

function naytaMaaranpaa() {

    if (kyytipyyntoAktiivinen) {
        return;
    }

    matkustajanMaaranpaa =
        document.getElementById(
            "maaranpaa"
        ).value;

    document.getElementById(
        "maaranpaa"
    ).value = "";

    document.getElementById(
        "tallennanappi"
    ).disabled = true;

    document.getElementById(
        "valittumaaranpaa"
    ).innerHTML =
        "Tallennettu määränpää: " +
        matkustajanMaaranpaa;

    document.getElementById(
        "luonappi"
    ).disabled = false;

}


/*
 * Matkustajan määränpään geokoodaus
 */

async function haeMatkustajanMaaranpaanKoordinaatit() {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/search?format=json&q=" +
        encodeURIComponent(
            matkustajanMaaranpaa
        )
    );

    const tulokset =
        await vastaus.json();

    if (tulokset.length == 0) {

        alert(
            "Matkustajan määränpäätä ei löytynyt"
        );

        matkustajanMaaranpaaLatitude = null;

        matkustajanMaaranpaaLongitude = null;

        return false;

    }

    matkustajanMaaranpaaLatitude =
        parseFloat(
            tulokset[0].lat
        );

    matkustajanMaaranpaaLongitude =
        parseFloat(
            tulokset[0].lon
        );

    console.log(
        "Matkustajan määränpään koordinaatit:",
        matkustajanMaaranpaaLatitude,
        matkustajanMaaranpaaLongitude
    );

    return true;

}

async function haeMatkustajanLahtopaikanNimi(latitude, longitude) {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/reverse?format=json&lat=" +
        latitude +
        "&lon=" +
        longitude +
        "&addressdetails=1"
    );

    const tulos = await vastaus.json();

    const osoite = tulos.address;
    
    const tarkkaPaikka =
        (osoite.road || osoite.pedestrian || osoite.path || "") +
        (osoite.house_number ? " " + osoite.house_number : "");
    
    const kaupunkiTaiKunta =
        osoite.city ||
        osoite.town ||
        osoite.municipality ||
        osoite.village ||
        "";
    
    const lahtopaikanNimi =
        tarkkaPaikka + ", " + kaupunkiTaiKunta;
    
    return lahtopaikanNimi;
}

    
/*
 * Kyytipyynnön luonti
 */

async function luoKyytipyynto() {

    console.log(
        "luoKyytipyynto käynnistyi"
    );

    if (
        kayttajanNykyinenLatitude == null ||
        kayttajanNykyinenLongitude == null
    ) {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Odottaa sijaintiasi." +
            "<br>Paina Luo kyytipyyntö -nappia pian uudestaan.";

        return;

    }

    if (matkustajanMaaranpaa == "") {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Anna ensin määränpää";

        return;

    }

    if (kyytipyyntoAktiivinen) {
        return;
    }

    const loytyi =
        await haeMatkustajanMaaranpaanKoordinaatit();

    if (!loytyi) {
        return;
    }

    const aika =
    new Date().toLocaleString();

    const lahtopaikanTiedot =
        await haeMatkustajanLahtopaikanNimi(
            kayttajanNykyinenLatitude,
            kayttajanNykyinenLongitude
        );

    const docRef = await addDoc(

        collection(
            db,
            "kyytipyynnot"
        ),

        {
            matkustajanLahtopaikka:
                lahtopaikanTiedot,
            
            matkustajanLahtopaikkaLatitude:
                kayttajanNykyinenLatitude,
            
            matkustajanLahtopaikkaLongitude:
                kayttajanNykyinenLongitude,
            
            matkustajanMaaranpaa:
                matkustajanMaaranpaa,

            matkustajanMaaranpaaLatitude:
                matkustajanMaaranpaaLatitude,

            matkustajanMaaranpaaLongitude:
                matkustajanMaaranpaaLongitude,

            luotu:
                new Date().toISOString(),

            status:
                "aktiivinen"
        }

    );

    firestoreKyytipyyntoId =
        docRef.id;

    kyytipyyntoAktiivinen =
        true;

    kuunteleOmaaKyytia();

    document.getElementById(
        "kyytipyynto"
    ).innerHTML =
        "Lähtöpaikka: " +
        kayttajanNykyinenSijaintiTeksti +
        "<br>Määränpää: " +
        matkustajanMaaranpaa +
        "<br>Luotu: " +
        aika;

    document.getElementById(
        "valittumaaranpaa"
    ).innerHTML = "";

    document.getElementById(
        "poistanappi"
    ).disabled = false;

    document.getElementById(
        "luonappi"
    ).disabled = true;

    document.getElementById(
        "tallennanappi"
    ).disabled = true;

    document.getElementById(
        "maaranpaa"
    ).disabled = true;

}


/*
 * Kyytipyynnön poistaminen
 */

async function peruKyytipyynto() {

    if (unsubscribeOmaKyyti) {

        unsubscribeOmaKyyti();

        unsubscribeOmaKyyti = null;

    }

    if (firestoreKyytipyyntoId != "") {

        await deleteDoc(

            doc(
                db,
                "kyytipyynnot",
                firestoreKyytipyyntoId
            )

        );

        firestoreKyytipyyntoId = "";

    }

    document.getElementById(
        "kyytipyynto"
    ).innerHTML =
        "Ei aktiivista kyytipyyntöä";

    document.getElementById(
        "valittumaaranpaa"
    ).innerHTML = "";

    document.getElementById(
        "kyytiSaapunut"
    ).innerHTML = "";

    matkustajanMaaranpaa = "";

    matkustajanMaaranpaaLatitude = null;

    matkustajanMaaranpaaLongitude = null;

    document.getElementById(
        "maaranpaa"
    ).value = "";

    kyytipyyntoAktiivinen = false;

    document.getElementById(
        "tallennanappi"
    ).disabled = true;

    document.getElementById(
        "poistanappi"
    ).disabled = true;

    document.getElementById(
        "luonappi"
    ).disabled = true;

    document.getElementById(
        "maaranpaa"
    ).disabled = false;

}


/*
 * Tarjoamisen aloittaminen
 */

async function aloitaTarjoaminen() {

    autonTuntomerkki =
        document.getElementById(
            "autonTuntomerkki"
        ).value;

    if (autonTuntomerkki == "") {

        alert(
            "Anna auton tuntomerkki"
        );

        return;

    }

    tarjoajanMaaranpaa =
        document.getElementById(
            "tarjoajanMaaranpaa"
        ).value;

    if (tarjoajanMaaranpaa == "") {

        alert(
            "Anna tarjoajan määränpää"
        );

        return;

    }

    if (
        kayttajanNykyinenLatitude == null ||
        kayttajanNykyinenLongitude == null
    ) {

        alert(
            "Odotetaan tarjoajan sijaintitietoa"
        );

        return;

    }

    const loytyi =
        await haeTarjoajanMaaranpaanKoordinaatit();

    if (!loytyi) {
        return;
    }

    await laskeReittiAB();

    haeKyytipyynnot();

    tarjoaminenAloitettu =
        new Date().toLocaleTimeString();

    tarjoaKyytia =
        true;

    document.getElementById(
        "tarjoajantila"
    ).innerHTML =
        "Tarjoan kyytiä" +
        "<br>Aloitettu: " +
        tarjoaminenAloitettu;

    document.getElementById(
        "aloitatarjoaminen"
    ).disabled = true;

    document.getElementById(
        "lopetatarjoaminen"
    ).disabled = false;

    document.getElementById(
        "autonTuntomerkki"
    ).disabled = true;

    document.getElementById(
        "tarjoajanMaaranpaa"
    ).disabled = true;

}


/*
 * Tarjoamisen lopettaminen
 */

function lopetaTarjoaminen() {

    if (unsubscribeKyytipyynnot) {

        unsubscribeKyytipyynnot();

        unsubscribeKyytipyynnot = null;

    }

    tarjoaKyytia = false;

    document.getElementById(
        "tarjoajantila"
    ).innerHTML =
        "En tarjoa kyytiä";

    document.getElementById(
        "aloitatarjoaminen"
    ).disabled = false;

    document.getElementById(
        "lopetatarjoaminen"
    ).disabled = true;

    document.getElementById(
        "lahellaolevatpyynnot"
    ).innerHTML =
        "Lähellä olevat kyytipyynnöt: 0";

    document.getElementById(
        "havaittukyytipyynto"
    ).innerHTML = "";

    document.getElementById(
        "autonTuntomerkki"
    ).disabled = false;

    document.getElementById(
        "autonTuntomerkki"
    ).value = "";

    document.getElementById(
        "tarjoajanMaaranpaa"
    ).disabled = false;

    document.getElementById(
        "tarjoajanMaaranpaa"
    ).value = "";

    document.getElementById(
        "tarjoajanKoordinaatit"
    ).innerHTML = "";

    document.getElementById(
        "reittiAB"
    ).innerHTML = "";

    autonTuntomerkki = "";

    tarjoajanMaaranpaa = "";

    tarjoajanMaaranpaaLatitude = null;

    tarjoajanMaaranpaaLongitude = null;

}


/*
 * Aktiivisten kyytipyyntöjen kuuntelu
 */

function haeKyytipyynnot() {

    const aktiivisetPyynnot = query(

        collection(
            db,
            "kyytipyynnot"
        ),

        where(
            "status",
            "==",
            "aktiivinen"
        )

    );

    unsubscribeKyytipyynnot = onSnapshot(

        aktiivisetPyynnot,

        (snapshot) => {

            console.log(
                "Kyytipyyntöjä löytyi:",
                snapshot.size
            );

            document.getElementById(
                "lahellaolevatpyynnot"
            ).innerHTML =
                "Lähellä olevat kyytipyynnöt: " +
                snapshot.size;

            let html = "";

            snapshot.forEach((doc) => {

                const pyynto =
                    doc.data();

              laskeReittiACDB(pyynto)
    .then((reittiACDB) => {

        const lisamatkaKm =
            reittiACDB.matkaKm - reittiABMatkaKm;

        const lisaaikaMin =
            reittiACDB.aikaMin - reittiABAikaMin;

        document.getElementById(
            "reitti_" + doc.id
        ).innerHTML =
            "A→C→D→B: " +
            reittiACDB.matkaKm.toFixed(1) +
            " km / " +
            reittiACDB.aikaMin.toFixed(0) +
            " min" +

            "<br><b>Lisämatka: +" +
            lisamatkaKm.toFixed(1) +
            " km</b>" +

            "<br><b>Lisäaika: +" +
            lisaaikaMin.toFixed(0) +
            " min</b>";

    });
                
                html +=
                    "<hr>" +

                    "<b>Kyytipyynnön ID:</b> " +
                    doc.id +
  
                    "<br><b>Lähtöpaikka:</b> " +
                    
                    pyynto.matkustajanLahtopaikka +
                    " (" +
                    pyynto.matkustajanLahtopaikkaLatitude +
                    ", " +
                    pyynto.matkustajanLahtopaikkaLongitude +
                    ")" +
                    
                    "<br><b>Määränpää:</b> " +
                    pyynto.matkustajanMaaranpaa +
                    " (" +
                    pyynto.matkustajanMaaranpaaLatitude +
                    ", " +
                    pyynto.matkustajanMaaranpaaLongitude +
                    ")" +

                    "<br><b>Luotu:</b> " +
                    new Date(
                        pyynto.luotu
                    ).toLocaleString() +

                    "<br><b>Status:</b> " +
                    pyynto.status +
                    
                    "<br><span id='reitti_" +
                    doc.id +
                    "'>Lasketaan A→C→D→B-reittiä...</span>" +
                    
                    "<br>" +
                    
                    "<button onclick=\"olenPaikalla('" +
                    doc.id +
                    "')\">" +
                    "Olen paikalla" +
                    "</button>" +

                    "<br>";

            });

            document.getElementById(
                "havaittukyytipyynto"
            ).innerHTML =
                html;

        }

    );

}


/*
 * Tarjoaja ilmoittaa olevansa paikalla
 */

async function olenPaikalla(id) {

    await updateDoc(

        doc(
            db,
            "kyytipyynnot",
            id
        ),

        {
            status:
                "tarjoaja_paikalla",

            autonTuntomerkki:
                autonTuntomerkki
        }

    );

}


/*
 * Matkustajan oman kyytipyynnön kuuntelu
 */

function kuunteleOmaaKyytia() {

    if (firestoreKyytipyyntoId == "") {
        return;
    }

    unsubscribeOmaKyyti = onSnapshot(

        doc(
            db,
            "kyytipyynnot",
            firestoreKyytipyyntoId
        ),

        (snapshot) => {

            if (!snapshot.exists()) {
                return;
            }

            const pyynto =
                snapshot.data();

            if (
                pyynto.status ==
                "tarjoaja_paikalla"
            ) {

                document.getElementById(
                    "kyytiSaapunut"
                ).innerHTML =
                    "🚕 Kyyti on saapunut" +

                    "<br><b>Auton tuntomerkki:</b> " +
                    pyynto.autonTuntomerkki +

                    "<br>" +

                    "<button onclick='hylkaaKyyti()'>" +
                    "Hylkää kyyti" +
                    "</button>";

            } else {

                document.getElementById(
                    "kyytiSaapunut"
                ).innerHTML = "";

            }

        }

    );

}


/*
 * Matkustaja hylkää paikalle saapuneen tarjoajan
 */

async function hylkaaKyyti() {

    await updateDoc(

        doc(
            db,
            "kyytipyynnot",
            firestoreKyytipyyntoId
        ),

        {
            status:
                "aktiivinen",

            autonTuntomerkki:
                ""
        }

    );

}


/*
 * Tarjoajan määränpään geokoodaus
 */

async function haeTarjoajanMaaranpaanKoordinaatit() {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/search?format=json&q=" +
        encodeURIComponent(
            tarjoajanMaaranpaa
        )
    );

    const tulokset =
        await vastaus.json();

    if (tulokset.length == 0) {

        alert(
            "Tarjoajan määränpäätä ei löytynyt"
        );

        tarjoajanMaaranpaaLatitude = null;

        tarjoajanMaaranpaaLongitude = null;

        return false;

    }

    tarjoajanMaaranpaaLatitude =
        parseFloat(
            tulokset[0].lat
        );

    tarjoajanMaaranpaaLongitude =
        parseFloat(
            tulokset[0].lon
        );

    document.getElementById(
        "tarjoajanKoordinaatit"
    ).innerHTML =
        "<b>Tarjoajan määränpään koordinaatit</b>" +
        "<br>Lat: " +
        tarjoajanMaaranpaaLatitude +
        "<br>Lon: " +
        tarjoajanMaaranpaaLongitude;

    console.log(
        "Tarjoajan määränpään koordinaatit:",
        tarjoajanMaaranpaaLatitude,
        tarjoajanMaaranpaaLongitude
    );

    return true;

}


/*
 * Tarjoajan normaali reitti A → B
 */

async function laskeReittiAB() {

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +

        kayttajanNykyinenLongitude +
        "," +
        kayttajanNykyinenLatitude +

        ";" +

        tarjoajanMaaranpaaLongitude +
        "," +
        tarjoajanMaaranpaaLatitude +

        "?overview=false";

    const vastaus =
        await fetch(url);

    const data =
        await vastaus.json();

    reittiABMatkaKm =
        data.routes[0].distance /
        1000;

    reittiABAikaMin =
        data.routes[0].duration /
        60;
    
    document.getElementById(
        "reittiAB"
    ).innerHTML =
        "<b>Reitti A → B</b>" +
        "<br>Matka: " +
        reittiABMatkaKm.toFixed(1) +
        " km" +
        "<br>Aika: " +
        reittiABAikaMin.toFixed(0) +
        " min";

}

async function laskeReittiACDB(pyynto) {

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +

        kayttajanNykyinenLongitude + "," +
        kayttajanNykyinenLatitude +

        ";" +

        pyynto.matkustajanLahtopaikkaLongitude + "," +
        pyynto.matkustajanLahtopaikkaLatitude +

        ";" +

        pyynto.matkustajanMaaranpaaLongitude + "," +
        pyynto.matkustajanMaaranpaaLatitude +

        ";" +

        tarjoajanMaaranpaaLongitude + "," +
        tarjoajanMaaranpaaLatitude +

        "?overview=false";

    const vastaus = await fetch(url);

    const data = await vastaus.json();

    return {

        matkaKm:
            data.routes[0].distance / 1000,

        aikaMin:
            data.routes[0].duration / 60

    };
}

/*
 * Moduulin funktiot HTML:n onclick-kutsuille
 */

window.naytaMaaranpaa =
    naytaMaaranpaa;

window.luoKyytipyynto =
    luoKyytipyynto;

window.peruKyytipyynto =
    peruKyytipyynto;

window.aloitaTarjoaminen =
    aloitaTarjoaminen;

window.lopetaTarjoaminen =
    lopetaTarjoaminen;

window.haeKyytipyynnot =
    haeKyytipyynnot;

window.olenPaikalla =
    olenPaikalla;

window.hylkaaKyyti =
    hylkaaKyyti;

</script>
