async function etsiMaaranpaa() {

    const hakuteksti =
        document.getElementById(
            "maaranpaa"
        ).value.trim();
    
    const sisaltaaNumeron =
        /\d/.test(hakuteksti);
    
if (!sisaltaaNumeron) {

        "maaranpaaHakutulokset"
    ).innerHTML =
        "Anna katuosoite ja numero, esimerkiksi Perkiöntie 12.";

}
    
    const perusVastaus =
        await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=20&countrycodes=fi&q=" +
            encodeURIComponent(hakuteksti)
        );

    const perusTulokset =
        await perusVastaus.json();

    const hakutekstiPienella =
        hakuteksti.toLowerCase();

    const kadunnimiMukana =
        perusTulokset.some((tulos) => {

            const kadunnimi =
                tulos.address?.road;

            return (
                kadunnimi &&
                hakutekstiPienella.includes(
                    kadunnimi.toLowerCase()
                )
            );

        });

    let kaikkiTulokset =
        perusTulokset;

    if (!kadunnimiMukana) {

        const paakohteet = [
            "rautatieasema",
            "linja-autoasema",
            "keskusta"
        ];

        for (const paakohde of paakohteet) {

            await new Promise((resolve) =>
                setTimeout(resolve, 1100)
            );

            const vastaus =
                await fetch(
                    "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=fi&q=" +
                    encodeURIComponent(
                        paakohde + " " + hakuteksti
                    )
                );

            const tulokset =
                await vastaus.json();

            kaikkiTulokset =
                kaikkiTulokset.concat(
                    tulokset
                );
        }
    }

    let html = "";

    const loydetytTulokset =
        new Set();

    kaikkiTulokset.forEach((tulos) => {

        const osoite =
            tulos.address || {};

        if (
            !osoite.road ||
            !osoite.house_number
        ) {
            return;
        }

        const katuosoite =
            osoite.road +
            " " +
            osoite.house_number;

        const kuntaTaiKaupunki =
            osoite.city ||
            osoite.town ||
            osoite.municipality ||
            osoite.village ||
            "";

        let osoiteTeksti = "";

        if (kadunnimiMukana) {

            osoiteTeksti =
                katuosoite +
                ", " +
                kuntaTaiKaupunki;

        } else {

            const kohteenNimi =
                tulos.name || "";

            osoiteTeksti =
                (kohteenNimi
                    ? kohteenNimi + ", "
                    : "") +
                katuosoite +
                ", " +
                kuntaTaiKaupunki;
        }

        if (
            loydetytTulokset.has(
                osoiteTeksti
            )
        ) {
            return;
        }

        loydetytTulokset.add(
            osoiteTeksti
        );

const koodattuOsoite =
    encodeURIComponent(
        osoiteTeksti
    );

html +=
    "<div style='margin-bottom: 8px;'>" +

"<button onclick=\"valitseMaaranpaa(" +
    "decodeURIComponent('" +

    "'), '" +

    "', '" +
    tulos.lon +
    "')\">" +

    "Luo kyytipyyntö" +

    "</button> " +

    osoiteTeksti +

async function haeMatkustajanLahtopaikanNimi(latitude, longitude) {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/reverse?format=json&lat=" +
        latitude +
        "&lon=" +
        longitude +
        "&addressdetails=1"
    );

    const tulos = await vastaus.json();

    const osoite = tulos.address;
    
    const tarkkaPaikka =
        (osoite.road || osoite.pedestrian || osoite.path || "") +
        (osoite.house_number ? " " + osoite.house_number : "");
    
    const kaupunkiTaiKunta =
        osoite.city ||
        osoite.town ||
        osoite.municipality ||
        osoite.village ||
        "";
    
    const lahtopaikanNimi =
        tarkkaPaikka + ", " + kaupunkiTaiKunta;
    
    return lahtopaikanNimi;
}

async function luoKyytipyynto() {

    if (
        kayttajanNykyinenLatitude == null ||
        kayttajanNykyinenLongitude == null
    ) {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Odottaa sijaintiasi." +
            "<br>Yritä pian uudestaan.";

        return;
    }

    if (matkustajanMaaranpaa == "") {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Anna ensin määränpää";

        return;
    }

    if (kyytipyyntoAktiivinen) {
        return;
    }

    const matkustajanReitti =
        await laskeMatkustajanReitti();

    const aika =
        new Date().toLocaleString();

    const lahtopaikanTiedot =
        await haeMatkustajanLahtopaikanNimi(
            kayttajanNykyinenLatitude,
            kayttajanNykyinenLongitude
        );

    const docRef = await addDoc(
        collection(
            db,
            "kyytipyynnot"
        ),
        {
            matkustajanLahtopaikka:
                lahtopaikanTiedot,

            matkustajanLahtopaikkaLatitude:
                kayttajanNykyinenLatitude,

            matkustajanLahtopaikkaLongitude:
                kayttajanNykyinenLongitude,

            matkustajanMaaranpaa:
                matkustajanMaaranpaa,

            matkustajanMaaranpaaLatitude:
                matkustajanMaaranpaaLatitude,

            matkustajanMaaranpaaLongitude:
                matkustajanMaaranpaaLongitude,

            luotu:
                new Date().toISOString(),

            status:
                "aktiivinen"
        }
    );

    firestoreKyytipyyntoId =
        docRef.id;

    kyytipyyntoAktiivinen =
        true;

    kuunteleOmaaKyytia();

const matkaAikaTunnit =
    Math.floor(
        matkustajanReitti.aikaMin / 60
    );

const matkaAikaMinuutit =
    Math.round(
        matkustajanReitti.aikaMin % 60
    );

document.getElementById(
    "kyytipyynto"
).innerHTML =
    "Lähtöpaikka: " +
    lahtopaikanTiedot +

    "<br>Määränpää: " +
    matkustajanMaaranpaa +
    " (" +
    matkustajanReitti.matkaKm.toFixed(1) +
    " km, " +
    matkaAikaTunnit +
    " h " +
    matkaAikaMinuutit +
    " min)" +

    "<br>Luotu: " +
    aika;

    document.getElementById(
        "poistanappi"
    ).disabled = false;

).disabled = true;

document.getElementById(
    "etsinappi"
).disabled = true;

document.getElementById(
    "maaranpaaHakutulokset"
).innerHTML = "";

}

    document.getElementById(
        "tarjoajanMaaranpaaHakutulokset"
    ).innerHTML = "";

        "reittiAB"
    ).innerHTML = "";

    tarjoajanMaaranpaa = "";

    noutomatkaRajaKm = null;

    noutoaikaRajaMin = null;

    lisamatkaRajaKm = null;

    reittiABMatkaKm = null;

    reittiABAikaMin = null;
}


/*
 * Aktiivisten kyytipyyntöjen kuuntelu
 */

function muotoileLuontiaika(aika) {

    const paivamaara =
        new Date(aika);

    const pvm =
        paivamaara.toLocaleDateString(
            "fi-FI"
        );

    const kellonaika =
        paivamaara.toLocaleTimeString(
            "fi-FI",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        ).replace(":", ".");

    return (
        pvm +
        " klo " +
        kellonaika
    );
}

function haeKaupunkiTaiKunta(osoite) {

    const osat =
        osoite.split(",");

    return osat[
        osat.length - 1
    ].trim();
}


function naytaOsoitetiedot(id) {

    laajatOsoitetiedot.add(

    document.getElementById(
        "osoitteetTiivis-" + id

    document.getElementById(
        "osoitteetLaaja-" + id

}


function piilotaOsoitetiedot(id) {

    laajatOsoitetiedot.delete(
        id
    );

    document.getElementById(
        "osoitteetLaaja-" + id
    ).style.display = "none";

    document.getElementById(
        "osoitteetTiivis-" + id
    ).style.display = "block";
}
    
function haeKyytipyynnot() {

    kyytipyyntojenHakuversio++;

    const tamanHaunVersio =
        kyytipyyntojenHakuversio;

    const aktiivisetPyynnot = query(
        collection(
            db,
            "kyytipyynnot"
        ),
        where(
            "status",
            "==",
            "aktiivinen"
        )
    );

    unsubscribeKyytipyynnot = onSnapshot(
        aktiivisetPyynnot,

        async (snapshot) => {

            const pyyntojenLaskelmat =
                await Promise.all(

                    snapshot.docs.map(
                        async (docSnapshot) => {

                            const pyynto =
                                docSnapshot.data();

                            const matkaNoutopaikalle =
                                await laskeMatkaNoutopaikalle(
                                    pyynto
                                );

                            const kuljetettavaMatka =
                                await laskeKuljetettavaMatka(
                                    pyynto
                                );

                            const reittiNoutopaikkaan =
                                await laskeReitiltaNoutopaikkaan(
                                    pyynto
                                );

                            const reittiACDB =
                                await laskeReittiACDB(
                                    pyynto
                                );

                            const lisamatkaKm =
                                reittiACDB.matkaKm -
                                reittiABMatkaKm;

                            const lisaaikaMin =
                                reittiACDB.aikaMin -
                                reittiABAikaMin;

                            return {
                                id:
                                    docSnapshot.id,

                                pyynto:
                                    pyynto,

                                matkaNoutopaikalle:
                                    matkaNoutopaikalle,

                                kuljetettavaMatka:
                                    kuljetettavaMatka,

                                reittiNoutopaikkaan:
                                    reittiNoutopaikkaan,

                                reittiACDB:
                                    reittiACDB,

                                lisamatkaKm:
                                    lisamatkaKm,

                                lisaaikaMin:
                                    lisaaikaMin
                            };
                        }
                    )
                );

            if (
                tamanHaunVersio !==
                kyytipyyntojenHakuversio
            ) {
                return;
            }

            const suodatetutPyynnot =
                pyyntojenLaskelmat.filter(
                    (laskelma) => {

                        return (
                            (
                                noutomatkaRajaKm == null ||
                                parseFloat(
                                    laskelma.reittiNoutopaikkaan.matkaKm.toFixed(1)
                                ) <= noutomatkaRajaKm
                            ) &&

                            (
                                noutoaikaRajaMin == null ||
                                parseFloat(
                                    laskelma.reittiNoutopaikkaan.aikaMin.toFixed(0)
                                ) <= noutoaikaRajaMin
                            ) &&

                            (
                                lisamatkaRajaKm == null ||
                                parseFloat(
                                    laskelma.lisamatkaKm.toFixed(1)
                                ) <= lisamatkaRajaKm
                            )
                        );
                    }
                );

            let html = "";

            suodatetutPyynnot.forEach(
                (laskelma) => {

                    const pyynto =
                        laskelma.pyynto;

                    const noutoaikaTunnit =
                        Math.floor(
                            laskelma.matkaNoutopaikalle.aikaMin / 60
                        );

                    const noutoaikaMinuutit =
                        Math.round(
                            laskelma.matkaNoutopaikalle.aikaMin % 60
                        );

                    const noutoaikaTeksti =
                        noutoaikaTunnit > 0
                            ? noutoaikaTunnit +
                                " h " +
                                noutoaikaMinuutit +
                                " min"
                            : noutoaikaMinuutit +
                                " min";


                    const reitiltaNoutoaikaTunnit =
                        Math.floor(
                            laskelma.reittiNoutopaikkaan.aikaMin / 60
                        );

                    const reitiltaNoutoaikaMinuutit =
                        Math.round(
                            laskelma.reittiNoutopaikkaan.aikaMin % 60
                        );

                    const reitiltaNoutoaikaTeksti =
                        reitiltaNoutoaikaTunnit > 0
                            ? reitiltaNoutoaikaTunnit +
                                " h " +
                                reitiltaNoutoaikaMinuutit +
                                " min"
                            : reitiltaNoutoaikaMinuutit +
                                " min";


                    const lisaAikaTunnit =
                        Math.floor(
                            laskelma.lisaaikaMin / 60
                        );

                    const lisaAikaMinuutit =
                        Math.round(
                            laskelma.lisaaikaMin % 60
                        );

                    const lisaAikaTeksti =
                        lisaAikaTunnit > 0
                            ? lisaAikaTunnit +
                                " h " +
                                lisaAikaMinuutit +
                                " min"
                            : lisaAikaMinuutit +
                                " min";


                    const omaReittiAikaTunnit =
                        Math.floor(
                            reittiABAikaMin / 60
                        );

                    const omaReittiAikaMinuutit =
                        Math.round(
                            reittiABAikaMin % 60
                        );

                    const omaReittiAikaTeksti =
                        omaReittiAikaTunnit > 0
                            ? omaReittiAikaTunnit +
                                " h " +
                                omaReittiAikaMinuutit +
                                " min"
                            : omaReittiAikaMinuutit +
                                " min";


                    const kokonaisAikaTunnit =
                        Math.floor(
                            laskelma.reittiACDB.aikaMin / 60
                        );

                    const kokonaisAikaMinuutit =
                        Math.round(
                            laskelma.reittiACDB.aikaMin % 60
                        );

                    const kokonaisAikaTeksti =
                        kokonaisAikaTunnit > 0
                            ? kokonaisAikaTunnit +
                                " h " +
                                kokonaisAikaMinuutit +
                                " min"
                            : kokonaisAikaMinuutit +
                                " min";


                    const pyydettyAikaTunnit =
                        Math.floor(
                            laskelma.kuljetettavaMatka.aikaMin / 60
                        );

                    const pyydettyAikaMinuutit =
                        Math.round(
                            laskelma.kuljetettavaMatka.aikaMin % 60
                        );

                    const pyydettyAikaTeksti =
                        pyydettyAikaTunnit > 0
                            ? pyydettyAikaTunnit +
                                " h " +
                                pyydettyAikaMinuutit +
                                " min"
                            : pyydettyAikaMinuutit +
                                " min";


                    const lahtokaupunki =
                        haeKaupunkiTaiKunta(
                            pyynto.matkustajanLahtopaikka
                        );

                    const maaranpaakaupunki =
                        haeKaupunkiTaiKunta(
                            pyynto.matkustajanMaaranpaa
                        );

                    const lahtoOsoite =
                        pyynto.matkustajanLahtopaikka
                            .split(",")
                            .slice(0, -1)
                            .join(",")
                            .trim();

                    const maaranpaaOsoite =
                        pyynto.matkustajanMaaranpaa
                            .split(",")
                            .slice(0, -1)
                            .join(",")
                            .trim();

                    const osoitetiedotNakyvissa =
                        laajatOsoitetiedot.has(
                            laskelma.id
                        );

                    html += `
                        <hr>

                        ${muotoileLuontiaika(pyynto.luotu)} /
                        ${pyynto.status}

                        <div
                            id="osoitteetTiivis-${laskelma.id}"
                            style="display: ${osoitetiedotNakyvissa ? "none" : "block"};"
                        >
                            <b>${lahtokaupunki} → ${maaranpaakaupunki}</b>

                            <br>

                            <button
                                onclick="naytaOsoitetiedot('${laskelma.id}')"
                            >
                                Näytä
                            </button>
                        </div>

                        <div
                            id="osoitteetLaaja-${laskelma.id}"
                            style="display: ${osoitetiedotNakyvissa ? "block" : "none"};"
                        >
                            📍 ${lahtoOsoite}, <b>${lahtokaupunki}</b>

                            <br>
                            🏁 ${maaranpaaOsoite}, <b>${maaranpaakaupunki}</b>

                            <br>

                            <button
                                onclick="piilotaOsoitetiedot('${laskelma.id}')"
                            >
                                Piilota
                            </button>
                        </div>

                        <br>

                        <b>Reitiltä noutopaikkaan:</b>
                        ${laskelma.reittiNoutopaikkaan.matkaKm.toFixed(1)} km /
                        ${reitiltaNoutoaikaTeksti}

                        <br><b>Vaikutus matkasi pituuteen:</b>
                        <br>
                        +${laskelma.lisamatkaKm.toFixed(1)} km
                        (${reittiABMatkaKm.toFixed(1)} → ${laskelma.reittiACDB.matkaKm.toFixed(1)} km)

                        <br>
                        +${lisaAikaTeksti}
                        (${omaReittiAikaTeksti} → ${kokonaisAikaTeksti})

                        <br>
                        <b>Pyydetyn matkan pituus:</b>
                        ${laskelma.kuljetettavaMatka.matkaKm.toFixed(1)} km /
                        ${pyydettyAikaTeksti}

                        <br><br>

                        <b>Noutopaikkaan:</b>
                        ${laskelma.matkaNoutopaikalle.matkaKm.toFixed(1)} km /
                        ${noutoaikaTeksti}

                        <br>

                        <button
                            onclick="olenPaikalla('${laskelma.id}')"
                        >
                            Olen paikalla
                        </button>

                        <br>
                    `;
                }
            );

            document.getElementById(
                "havaittukyytipyynto"
            ).innerHTML =
                html;
        }
    );
}

/*

 */

async function laskeReittiAB() {

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +

        kayttajanNykyinenLongitude +
        "," +
        kayttajanNykyinenLatitude +

        ";" +

        tarjoajanMaaranpaaLongitude +
        "," +
        tarjoajanMaaranpaaLatitude +

        "?overview=full&geometries=geojson";

    const vastaus =
        await fetch(url);

    const data =
        await vastaus.json();

    reittiABKoordinaatit =
        data.routes[0].geometry.coordinates;

    reittiABMatkaKm =
        data.routes[0].distance /
        1000;

    reittiABAikaMin =
        data.routes[0].duration /
        60;

    const tunnit =
        Math.floor(
            reittiABAikaMin / 60
        );

    const minuutit =
        Math.round(
            reittiABAikaMin % 60
        );

    document.getElementById(
        "reittiAB"
    ).innerHTML =
"<b>Kyydin tarjoaminen on päällä (" +
tarjoaminenAloitettu +
")</b>" +

        "<br>Määränpää: " +
        tarjoajanMaaranpaa +
        " (" +
        reittiABMatkaKm.toFixed(1) +
        " km, " +
        tunnit +
        " h " +
        minuutit +
        " min)";
}

function laskeEtaisyysMetreina(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}

}

async function laskeReitiltaNoutopaikkaan(pyynto) {

    let lahinKoordinaatti = null;
    let lyhinEtaisyys = Infinity;

    reittiABKoordinaatit.forEach(
        (koordinaatti) => {

            const longitude =
                koordinaatti[0];

            const latitude =
                koordinaatti[1];

            const etaisyys =
                laskeEtaisyysMetreina(
                    latitude,
                    longitude,
                    pyynto.matkustajanLahtopaikkaLatitude,
                    pyynto.matkustajanLahtopaikkaLongitude
                );

            if (etaisyys < lyhinEtaisyys) {

                lyhinEtaisyys =
                    etaisyys;

                lahinKoordinaatti =
                    koordinaatti;
            }
        }
    );

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +

        lahinKoordinaatti[0] + "," +
        lahinKoordinaatti[1] +

        ";" +

        pyynto.matkustajanLahtopaikkaLongitude + "," +
        pyynto.matkustajanLahtopaikkaLatitude +

        "?overview=false";

    const vastaus =
        await fetch(url);

    const data =
        await vastaus.json();

    return {
        matkaKm:
            data.routes[0].distance / 1000,

        aikaMin:
            data.routes[0].duration / 60
    };
}

        document.getElementById(
            "noutomatkaRajaKm"
        ).value;

    const noutoaikaArvo =
        document.getElementById(
            "noutoaikaRajaMin"
        ).value;

    const lisamatkaArvo =

        ).value;

        noutomatkaArvo === ""
            ? null
            : parseFloat(noutomatkaArvo);

    noutoaikaRajaMin =
        noutoaikaArvo === ""
            ? null
            : parseFloat(noutoaikaArvo);

    lisamatkaRajaKm =
        lisamatkaArvo === ""
            ? null
            : parseFloat(lisamatkaArvo);

    document.getElementById(
        "noutomatkaRajaKm"
    ).disabled = true;

    document.getElementById(
        "noutoaikaRajaMin"
    ).disabled = true;

    document.getElementById(
        "lisamatkaRajaKm"
    ).disabled = true;

    document.getElementById(
        "suodataNappi"
    ).disabled = true;

    document.getElementById(
        "poistaSuodatusNappi"
    ).disabled = false;

    if (unsubscribeKyytipyynnot) {

        unsubscribeKyytipyynnot();

        unsubscribeKyytipyynnot = null;
    }

    haeKyytipyynnot();
}

function poistaSuodatus() {

    noutomatkaRajaKm = null;

    noutoaikaRajaMin = null;

    lisamatkaRajaKm = null;

    document.getElementById(
        "noutomatkaRajaKm"
    ).disabled = false;

    document.getElementById(
        "noutoaikaRajaMin"
    ).disabled = false;

    document.getElementById(
        "lisamatkaRajaKm"
    ).disabled = false;

paivitaSuodataNappi();

    document.getElementById(
        "poistaSuodatusNappi"
    ).disabled = true;

    if (unsubscribeKyytipyynnot) {

        unsubscribeKyytipyynnot();

        unsubscribeKyytipyynnot = null;
    }

    haeKyytipyynnot();
}
