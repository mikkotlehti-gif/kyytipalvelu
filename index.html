async function etsiMaaranpaa() {

    const hakuteksti =
        document.getElementById(
            "maaranpaa"
        ).value.trim();

    const sisaltaaNumeron =
        /\d/.test(hakuteksti);

    if (!sisaltaaNumeron) {

        document.getElementById(
            "maaranpaaHakutulokset"
        ).innerHTML =
            "Anna katuosoite ja numero, esimerkiksi Perkiöntie 12.";

        return;
    }

    const perusVastaus =
        await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=20&countrycodes=fi&q=" +
            encodeURIComponent(hakuteksti)
        );

    const perusTulokset =
        await perusVastaus.json();

    const hakutekstiPienella =
        hakuteksti.toLowerCase();

    const kadunnimiMukana =
        perusTulokset.some((tulos) => {

            const kadunnimi =
                tulos.address?.road;

            return (
                kadunnimi &&
                hakutekstiPienella.includes(
                    kadunnimi.toLowerCase()
                )
            );

        });

    let kaikkiTulokset =
        perusTulokset;

    if (!kadunnimiMukana) {

        const paakohteet = [
            "rautatieasema",
            "linja-autoasema",
            "keskusta"
        ];

        for (const paakohde of paakohteet) {

            await new Promise((resolve) =>
                setTimeout(resolve, 1100)
            );

            const vastaus =
                await fetch(
                    "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=fi&q=" +
                    encodeURIComponent(
                        paakohde + " " + hakuteksti
                    )
                );

            const tulokset =
                await vastaus.json();

            kaikkiTulokset =
                kaikkiTulokset.concat(
                    tulokset
                );
        }
    }

    let html = "";

    const loydetytTulokset =
        new Set();

    kaikkiTulokset.forEach((tulos) => {

        const osoite =
            tulos.address || {};

        if (
            !osoite.road ||
            !osoite.house_number
        ) {
            return;
        }

        const katuosoite =
            osoite.road +
            " " +
            osoite.house_number;

        const kuntaTaiKaupunki =
            osoite.city ||
            osoite.town ||
            osoite.municipality ||
            osoite.village ||
            "";

        let osoiteTeksti = "";

        if (kadunnimiMukana) {

            osoiteTeksti =
                katuosoite +
                ", " +
                kuntaTaiKaupunki;

        } else {

            const kohteenNimi =
                tulos.name || "";

            osoiteTeksti =
                (kohteenNimi
                    ? kohteenNimi + ", "
                    : "") +
                katuosoite +
                ", " +
                kuntaTaiKaupunki;
        }

        if (
            loydetytTulokset.has(
                osoiteTeksti
            )
        ) {
            return;
        }

        loydetytTulokset.add(
            osoiteTeksti
        );

        const koodattuOsoite =
            encodeURIComponent(
                osoiteTeksti
            );

        html +=
            "<div style='margin-bottom: 8px;'>" +

            "<button onclick=\"valitseMaaranpaa(" +
            "decodeURIComponent('" +
            koodattuOsoite +
            "'), '" +
            tulos.lat +
            "', '" +
            tulos.lon +
            "')\">" +

            "Luo kyytipyyntö" +

            "</button> " +

            osoiteTeksti +

            "</div>";

    });

    document.getElementById(
        "maaranpaaHakutulokset"
    ).innerHTML =
        html ||
        "Sopivia osoitteita ei löytynyt.";
}

            "&addressdetails=1"
        );

    const tulos =
        await vastaus.json();

    const osoite =
        tulos.address;

    const tarkkaPaikka =
        (osoite.road ||
            osoite.pedestrian ||
            osoite.path ||
            "") +
        (
            osoite.house_number
                ? " " + osoite.house_number
                : ""
        );

    const kaupunkiTaiKunta =
        osoite.city ||
        osoite.town ||
        osoite.municipality ||
        osoite.village ||
        "";

    return (
        tarkkaPaikka +
        ", " +
        kaupunkiTaiKunta
    );
}


async function luoKyytipyynto() {

    if (
        kayttajanNykyinenLatitude == null ||
        kayttajanNykyinenLongitude == null
    ) {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Odottaa sijaintiasi." +
            "<br>Yritä pian uudestaan.";

        return;
    }

    if (matkustajanMaaranpaa == "") {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Anna ensin määränpää";

        return;
    }

    if (kyytipyyntoAktiivinen) {
        return;
    }

    const matkustajanReitti =
        await laskeMatkustajanReitti();

    const aika =
        new Date().toLocaleString();

    const lahtopaikanTiedot =
        await haeMatkustajanLahtopaikanNimi(
            kayttajanNykyinenLatitude,
            kayttajanNykyinenLongitude
        );

    const docRef =
        await addDoc(
            collection(
                db,
                "kyytipyynnot"
            ),
            {
                matkustajanLahtopaikka:
                    lahtopaikanTiedot,

                matkustajanLahtopaikkaLatitude:
                    kayttajanNykyinenLatitude,

                matkustajanLahtopaikkaLongitude:
                    kayttajanNykyinenLongitude,

                matkustajanMaaranpaa:
                    matkustajanMaaranpaa,

                matkustajanMaaranpaaLatitude:
                    matkustajanMaaranpaaLatitude,

                matkustajanMaaranpaaLongitude:
                    matkustajanMaaranpaaLongitude,

                luotu:
                    new Date().toISOString(),

                status:
                    "aktiivinen"
            }
        );

    firestoreKyytipyyntoId =
        docRef.id;

    kyytipyyntoAktiivinen =
        true;

    kuunteleOmaaKyytia();

    const matkaAikaTunnit =
        Math.floor(
            matkustajanReitti.aikaMin /
            60
        );

    const matkaAikaMinuutit =
        Math.round(
            matkustajanReitti.aikaMin %
            60
        );

    document.getElementById(
        "kyytipyynto"
    ).innerHTML =
        "Lähtöpaikka: " +
        lahtopaikanTiedot +

        "<br>Määränpää: " +
        matkustajanMaaranpaa +
        " (" +
        matkustajanReitti.matkaKm.toFixed(1) +
        " km, " +
        matkaAikaTunnit +
        " h " +
        matkaAikaMinuutit +
        " min)" +

        "<br>Luotu: " +
        aika;

    document.getElementById(
        "poistanappi"
    ).disabled = false;

    document.getElementById(
        "maaranpaa"
    ).disabled = true;

    document.getElementById(
        "etsinappi"
    ).disabled = true;

    document.getElementById(
        "maaranpaaHakutulokset"
    ).innerHTML = "";
}

        document.getElementById(
            "autonTuntomerkki"
        ).value;

    const tarjoajaJoMatkalla =
        document.getElementById(
            "tarjoajaJoMatkalla"
        ).checked;

    tarjoajanLahtoAikaisintaan =
        tarjoajaJoMatkalla
            ? null
            : document.getElementById(
                "tarjoajanLahtoAikaisintaan"
            ).value || null;

    tarjoajanPerillaViimeistaan =
        document.getElementById(
            "tarjoajanPerillaViimeistaan"
        ).value || null;


    if (
        !tarjoajaJoMatkalla &&
        !tarjoajanLahtoAikaisintaan
    ) {

        alert(
            "Anna Haluan lähteä aikaisintaan -aika tai valitse Olen jo matkalla."
        );

        return;
    }


    if (
        !tarjoajaJoMatkalla &&
        !tarjoajanPerillaViimeistaan
    ) {

        alert(
            "Anna Haluan olla perillä viimeistään -aika."
        );

        return;
    }


    if (
        tarjoajanLahtoAikaisintaan &&
        new Date(
            tarjoajanLahtoAikaisintaan
        ).getTime() <
            Date.now()
    ) {

        alert(
            "Haluan lähteä aikaisintaan -aika ei voi olla menneisyydessä."
        );

        return;
    }


    if (autonTuntomerkki == "") {

        alert(
            "Anna auton tuntomerkki"

    }


    if (
        tarjoajanMaaranpaa == "" ||
        tarjoajanMaaranpaaLatitude == null ||
        tarjoajanMaaranpaaLongitude == null
    ) {

        alert(

    ) {

        alert(

    await laskeReittiAB();

    paivitaSuodatus();

            ).getTime()
            : nykyinenAikaMs;

    const todellinenLahtoaikaMs =
        tarjoajaJoMatkalla
            ? nykyinenAikaMs
            : Math.max(
                nykyinenAikaMs,
                annettuLahtoaikaMs
            );

    const omanMatkanKestoMs =
        reittiABAikaMin *
        60 *
        1000;

    const aikaisinMahdollinenSaapuminenMs =
        todellinenLahtoaikaMs +
        omanMatkanKestoMs;


    if (tarjoajanPerillaViimeistaan) {

        const perillaViimeistaanMs =
            new Date(
                tarjoajanPerillaViimeistaan
            ).getTime();

        if (
            aikaisinMahdollinenSaapuminenMs >
            perillaViimeistaanMs
        ) {

            alert(
                "Et ehdi omaan määränpäähäsi annettuun määräaikaan mennessä."
            );

            return;
        }
    }


    tarjoaKyytia = true;


    document.getElementById(
        "ohariRajaProsentti"
    ).disabled = false;

    document.getElementById(
        "lisamatkaRajaProsentti"
    ).disabled = false;

    document.getElementById(
        "kyydinPituusAlarajaProsentti"
    ).disabled = false;

    document.getElementById(
        "kyydinPituusYlarajaProsentti"
    ).disabled = false;


    document.getElementById(
        "autonTuntomerkki"
    ).disabled = true;

    document.getElementById(
        "tarjoajanMaaranpaa"
    ).disabled = true;

    document.getElementById(
        "vaihdaTarjoajanMaaranpaaNappi"
    ).disabled = true;

    document.getElementById(
        "tarjoajaJoMatkalla"
    ).disabled = true;

    document.getElementById(
        "tarjoajanLahtoAikaisintaan"
    ).disabled = true;

    document.getElementById(
        "tarjoajanPerillaViimeistaan"
    ).disabled = true;

    document.getElementById(
        "etsiTarjoajanMaaranpaaNappi"
    ).disabled = true;

    document.getElementById(
        "tarjoajanMaaranpaaHakutulokset"
    ).innerHTML = "";


    paivitaLisamatkaProsentti();
    
    paivitaOhariProsentti();
    
    paivitaSuodatus();
    
    haeKyytipyynnot();

    paivitaKyytienEtsiminenKytkin();
}

function haeKyytipyynnot() {

    kyytipyyntojenHakuversio++;

    const tamanHaunVersio =
        kyytipyyntojenHakuversio;

    const aktiivisetPyynnot =
        query(
            collection(
                db,
                "kyytipyynnot"
            ),
            where(
                "status",
                "==",
                "aktiivinen"
            )
        );

    unsubscribeKyytipyynnot =
        onSnapshot(
            aktiivisetPyynnot,

            async (snapshot) => {

                const pyyntojenLaskelmat =
                    await Promise.all(

                        snapshot.docs.map(
                            async (docSnapshot) => {

                                const pyynto =
                                    docSnapshot.data();

                                const matkaNoutopaikalle =
                                    await laskeMatkaNoutopaikalle(
                                        pyynto
                                    );

                                const kuljetettavaMatka =
                                    await laskeKuljetettavaMatka(
                                        pyynto
                                    );

                                const reittiNoutopaikkaan =
                                    await laskeReitiltaNoutopaikkaan(
                                        pyynto
                                    );

                                const reittiACDB =
                                    await laskeReittiACDB(
                                        pyynto
                                    );

                                const lisamatkaKm =
                                    reittiACDB.matkaKm -
                                    reittiABMatkaKm;

                                const lisaaikaMin =
                                    reittiACDB.aikaMin -
                                    reittiABAikaMin;

                                return {
                                    id:
                                        docSnapshot.id,

                                    pyynto:
                                        pyynto,

                                    matkaNoutopaikalle:
                                        matkaNoutopaikalle,

                                    kuljetettavaMatka:
                                        kuljetettavaMatka,

                                    reittiNoutopaikkaan:
                                        reittiNoutopaikkaan,

                                    reittiACDB:
                                        reittiACDB,

                                    lisamatkaKm:
                                        lisamatkaKm,

                                    lisaaikaMin:
                                        lisaaikaMin
                                };
                            }
                        )
                    );


                if (
                    tamanHaunVersio !==
                    kyytipyyntojenHakuversio
                ) {
                    return;
                }


                aktiivistenKyytipyyntojenMaara =
                    pyyntojenLaskelmat.length;


                const suodatetutPyynnot =
                    pyyntojenLaskelmat.filter(
                        (laskelma) => {

                            return (
                                (
                                    noutomatkaRajaKm == null ||
                                    parseFloat(
                                        laskelma.reittiNoutopaikkaan.matkaKm.toFixed(1)
                                    ) <=
                                        noutomatkaRajaKm
                                ) &&

                                (
                                    noutoaikaRajaMin == null ||
                                    parseFloat(
                                        laskelma.reittiNoutopaikkaan.aikaMin.toFixed(0)
                                    ) <=
                                        noutoaikaRajaMin
                                ) &&

                                (
                                    lisamatkaRajaKm == null ||
                                    parseFloat(
                                        laskelma.lisamatkaKm.toFixed(1)
                                    ) <=
                                        lisamatkaRajaKm
                                ) &&

                                (
                                    lisaaikaRajaMin == null ||
                                    parseFloat(
                                        laskelma.lisaaikaMin.toFixed(0)
                                    ) <=
                                        lisaaikaRajaMin
                                ) &&

                                (
                                    pyydettyMatkaAlarajaKm == null ||
                                    parseFloat(laskelma.kuljetettavaMatka.matkaKm.toFixed(1)) >= pyydettyMatkaAlarajaKm
                                ) &&
                                (
                                    pyydettyMatkaYlarajaKm == null ||
                                    parseFloat(laskelma.kuljetettavaMatka.matkaKm.toFixed(1)) <= pyydettyMatkaYlarajaKm
                                ) &&
                                (
                                    pyydettyAikaAlarajaMin == null ||
                                    parseFloat(laskelma.kuljetettavaMatka.aikaMin.toFixed(0)) >= pyydettyAikaAlarajaMin
                                ) &&
                                (
                                    pyydettyAikaYlarajaMin == null ||
                                    parseFloat(laskelma.kuljetettavaMatka.aikaMin.toFixed(0)) <= pyydettyAikaYlarajaMin
                                )
                            );
                        }
                    );


                document.getElementById(
                    "kyytipyyntojenMaara"
                ).textContent =
                    suodatetutPyynnot.length;


                let html = "";


                suodatetutPyynnot.forEach(
                    (laskelma) => {

                        const pyynto =
                            laskelma.pyynto;


                        const noutoaikaTunnit =
                            Math.floor(
                                laskelma.matkaNoutopaikalle.aikaMin /
                                60
                            );

                        const noutoaikaMinuutit =
                            Math.round(
                                laskelma.matkaNoutopaikalle.aikaMin %
                                60
                            );

                        const noutoaikaTeksti =
                            noutoaikaTunnit > 0
                                ? noutoaikaTunnit +
                                    " h " +
                                    noutoaikaMinuutit +
                                    " min"
                                : noutoaikaMinuutit +
                                    " min";


                        const reitiltaNoutoaikaTunnit =
                            Math.floor(
                                laskelma.reittiNoutopaikkaan.aikaMin /
                                60
                            );

                        const reitiltaNoutoaikaMinuutit =
                            Math.round(
                                laskelma.reittiNoutopaikkaan.aikaMin %
                                60
                            );

                        const reitiltaNoutoaikaTeksti =
                            reitiltaNoutoaikaTunnit > 0
                                ? reitiltaNoutoaikaTunnit +
                                    " h " +
                                    reitiltaNoutoaikaMinuutit +
                                    " min"
                                : reitiltaNoutoaikaMinuutit +
                                    " min";


                        const lisaAikaTunnit =
                            Math.floor(
                                laskelma.lisaaikaMin /
                                60
                            );

                        const lisaAikaMinuutit =
                            Math.round(
                                laskelma.lisaaikaMin %
                                60
                            );

                        const lisaAikaTeksti =
                            lisaAikaTunnit > 0
                                ? lisaAikaTunnit +
                                    " h " +
                                    lisaAikaMinuutit +
                                    " min"
                                : lisaAikaMinuutit +
                                    " min";


                        const omaReittiAikaTunnit =
                            Math.floor(
                                reittiABAikaMin /
                                60
                            );

                        const omaReittiAikaMinuutit =
                            Math.round(
                                reittiABAikaMin %
                                60
                            );

                        const omaReittiAikaTeksti =
                            omaReittiAikaTunnit > 0

                                    pyydettyAikaMinuutit +
                                    " min"

                        const lahtokaupunki =
                            haeKaupunkiTaiKunta(

                        const maaranpaaOsoite =

                                .slice(0, -1)
                                .join(",")
                                .trim();


                        const osoitetiedotNakyvissa =
                            laajatOsoitetiedot.has(

                        html += `

async function laskeReittiAB() {

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +

        kayttajanNykyinenLongitude +
        "," +
        kayttajanNykyinenLatitude +

        ";" +

        tarjoajanMaaranpaaLongitude +
        "," +
        tarjoajanMaaranpaaLatitude +

        "?overview=full&geometries=geojson";

    const vastaus =
        await fetch(url);

    const data =
        await vastaus.json();

    reittiABKoordinaatit =
        data.routes[0].geometry.coordinates;

    reittiABMatkaKm =
        data.routes[0].distance /
        1000;

    reittiABAikaMin =
        data.routes[0].duration /
        60;

    const tunnit =
        Math.floor(
            reittiABAikaMin /
            60
        );

    const minuutit =
        Math.round(
            reittiABAikaMin %
            60
        );

    const reittiABAikaTeksti =
        tunnit > 0
            ? tunnit +
                " h " +
                minuutit +
                " min"
            : minuutit +
                " min";

    document.getElementById(
        "tarjoajanValittuReitti"
    ).innerHTML =
        reittiABMatkaKm.toFixed(1) +
        " km / " +
        reittiABAikaTeksti;


    if (
        document.getElementById(
            "ohariRajaProsentti"
        ).value !== ""
    ) {

        paivitaOhariProsentti();
    }


    if (
        document.getElementById(
            "lisamatkaRajaProsentti"
        ).value !== ""
    ) {

        paivitaLisamatkaProsentti();
    }
}


function laskeEtaisyysMetreina(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R =
        6371000;

    const dLat =
        (lat2 - lat1) *
        Math.PI /
        180;

    const dLon =
        (lon2 - lon1) *
        Math.PI /
        180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 *
            Math.PI /
            180
        ) *

        Math.cos(
            lat2 *
            Math.PI /
            180
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}

function paivitaKyydinPituus(muutettuNuppi = "", haePyynnotUudelleen = true) {
    const ala = document.getElementById("kyydinPituusAlarajaProsentti");
    const yla = document.getElementById("kyydinPituusYlarajaProsentti");
    let alaraja = parseInt(ala.value);
    let ylaraja = parseInt(yla.value);
    if (muutettuNuppi === "alaraja" && alaraja > ylaraja) { alaraja = ylaraja; ala.value = alaraja; }
    if (muutettuNuppi === "ylaraja" && ylaraja < alaraja) { ylaraja = alaraja; yla.value = ylaraja; }
    kyydinPituusAlarajaProsentti = alaraja;
    kyydinPituusYlarajaProsentti = ylaraja;
    
    document.getElementById(
        "kyydinPituusVasenVaalea"
    ).style.width =
        (325 * alaraja / 100) + "px";
    
    document.getElementById("kyydinPituusProsenttiTeksti").textContent = alaraja + "–" + ylaraja + " %";
    if (reittiABMatkaKm == null || reittiABAikaMin == null) {
        pyydettyMatkaAlarajaKm = pyydettyMatkaYlarajaKm = null;
        pyydettyAikaAlarajaMin = pyydettyAikaYlarajaMin = null;
        document.getElementById("kyydinPituusLaskettu").textContent = "";
        paivitaSuodataNappi();
        return;
    }
    const kokonaismatkaKm = reittiABMatkaKm + (lisamatkaRajaKm == null ? 0 : lisamatkaRajaKm);
    const kokonaisaikaMin = reittiABAikaMin + (lisaaikaRajaMin == null ? 0 : lisaaikaRajaMin);
    pyydettyMatkaAlarajaKm = kokonaismatkaKm * alaraja / 100;
    pyydettyMatkaYlarajaKm = kokonaismatkaKm * ylaraja / 100;
    pyydettyAikaAlarajaMin = kokonaisaikaMin * alaraja / 100;
    pyydettyAikaYlarajaMin = kokonaisaikaMin * ylaraja / 100;
    document.getElementById("kyydinPituusLaskettu").textContent = " → " + pyydettyMatkaAlarajaKm.toFixed(1) + "–" + pyydettyMatkaYlarajaKm.toFixed(1) + " km / " + Math.round(pyydettyAikaAlarajaMin) + "–" + Math.round(pyydettyAikaYlarajaMin) + " min";
    paivitaSuodataNappi();
    if (haePyynnotUudelleen && unsubscribeKyytipyynnot) { unsubscribeKyytipyynnot(); unsubscribeKyytipyynnot = null; }
    if (haePyynnotUudelleen && tarjoaKyytia) haeKyytipyynnot();
}

function paivitaSuodatus() {
    paivitaSuodataNappi();
    if (unsubscribeKyytipyynnot) { unsubscribeKyytipyynnot(); unsubscribeKyytipyynnot = null; }
    if (tarjoaKyytia) haeKyytipyynnot();
}

function paivitaSuodataNappi() {
    const ohariTyhja = document.getElementById("ohariRajaProsentti").value === "0";
    const lisamatkaTyhja = document.getElementById("lisamatkaRajaProsentti").value === "0";
    const kyydinPituusTyhja = document.getElementById("kyydinPituusAlarajaProsentti").value === "0" && document.getElementById("kyydinPituusYlarajaProsentti").value === "100";
    document.getElementById("tyhjennaKaikkiSuodattimetNappi").disabled = ohariTyhja && lisamatkaTyhja && kyydinPituusTyhja;
}

    document.getElementById("lisamatkaRajaProsentti").value = "0";

    ohariRajaProsentti = null; noutomatkaRajaKm = null; noutoaikaRajaMin = null;

function paivitaKokonaismatka() {

    const kokonaismatkaTeksti =
        document.getElementById(
            "kokonaismatkaLaskettu"
        );

    if (
        reittiABMatkaKm == null ||
        reittiABAikaMin == null
    ) {

        kokonaismatkaTeksti.textContent =
            "";

        return;
    }

    const lisamatkaKm =
        lisamatkaRajaKm == null
            ? 0
            : lisamatkaRajaKm;

    const lisaaikaMin =
        lisaaikaRajaMin == null
            ? 0
            : lisaaikaRajaMin;

    const laskettuKokonaismatkaKm =
        reittiABMatkaKm +
        lisamatkaKm;

    const laskettuKokonaisaikaMin =
        reittiABAikaMin +
        lisaaikaMin;

    kokonaismatkaTeksti.textContent =
        laskettuKokonaismatkaKm.toFixed(1) +
        " km / " +
        Math.round(
            laskettuKokonaisaikaMin
        ) +
        " min";

    paivitaKyydinPituus("", false);
}


function paivitaOhariProsentti(
    haePyynnotUudelleen = true
) {

    const saadin =
        document.getElementById(
            "ohariRajaProsentti"
        );

    const saadinAsento =
        parseInt(
            saadin.value
        );

    const sallitutProsentit = [
        0,
        1,
        2,
        5,
        10,
        15,
        20,
        30,
        40,
        50,
        75,
        100
    ];


    /*
     * Asento 0 tarkoittaa:
     * Turha ajo -suodatin pois päältä.
     */

    if (saadinAsento === 0) {

        ohariRajaProsentti = null;

        noutomatkaRajaKm = null;

        noutoaikaRajaMin = null;

        document.getElementById(
            "ohariProsenttiTeksti"
        ).textContent = "";

        document.getElementById(
            "ohariLaskettu"
        ).textContent = "";

    } else {

        const prosentti =
            sallitutProsentit[
                saadinAsento - 1
            ];

        ohariRajaProsentti =
            prosentti;


        /*
         * Jos Lisämatka enintään on OFF,
         * käytetään laskentapohjana 100 % normaalista
         * jäljellä olevasta matkasta.
         *
         * Muuten käytetään Lisämatka enintään
         * -suodattimen laskennallisia km/min-arvoja.
         */

        const laskentapohjaKm =
            lisamatkaRajaKm == null
                ? reittiABMatkaKm
                : lisamatkaRajaKm;

        const laskentapohjaMin =
            lisaaikaRajaMin == null
                ? reittiABAikaMin
                : lisaaikaRajaMin;


        noutomatkaRajaKm =
            laskentapohjaKm *
            prosentti /
            100;

        noutoaikaRajaMin =
            laskentapohjaMin *
            prosentti /
            100;


        document.getElementById(
            "ohariProsenttiTeksti"
        ).textContent =
            prosentti +
            " %";

        document.getElementById(
            "ohariLaskettu"
        ).textContent =
            " → " +
            noutomatkaRajaKm.toFixed(1) +
            " km / " +
            Math.round(
                noutoaikaRajaMin
            ) +
            " min";
    }


    paivitaSuodataNappi();


    if (
        haePyynnotUudelleen &&
        unsubscribeKyytipyynnot
    ) {

        unsubscribeKyytipyynnot();

        unsubscribeKyytipyynnot =
            null;
    }


    if (
        haePyynnotUudelleen &&
        tarjoaKyytia
    ) {

        haeKyytipyynnot();
    }
}

            prosentti;

        lisamatkaRajaKm =

        document.getElementById(

        document.getElementById(

            ) +

    }


        paivitaKokonaismatka();
        
        paivitaOhariProsentti(false);

    if (unsubscribeKyytipyynnot) {

        unsubscribeKyytipyynnot();

        unsubscribeKyytipyynnot =

    if (tarjoaKyytia) {

}
