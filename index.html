<h1>Kyytipalvelu</h1>
<button>Näytä sijaintini</button><br>
<input id="maaranpaa" type="text" placeholder="Anna määränpää" size="30">
<button onclick="naytaMaaranpaa()">Tallenna määränpää</button>
<p id="valittumaaranpaa"></p>
<p id="sijainti"></p>
<script>
navigator.geolocation.getCurrentPosition(
    function(sijainti) {
        document.getElementById("sijainti").innerHTML = "Leveysaste: " + sijainti.coords.latitude + "<br>Pituusaste: " + sijainti.coords.longitude;
    },
    function(virhe) {
        document.getElementById("sijainti").innerHTML = virhe.message;
    }
);
</script>
