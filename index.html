<h1>Kyytipalvelu</h1>

<input id="maaranpaa" type="text" placeholder="Anna määränpää" size="30" oninput="document.getElementById('tallennanappi').disabled = (this.value=='')">

<button id="tallennanappi" onclick="naytaMaaranpaa()" disabled>Tallenna määränpää</button>

<br><br>

<button id="luonappi" onclick="luoKyytipyynto()" disabled>Luo kyytipyyntö</button>
<button id="poistanappi" onclick="peruKyytipyynto()" disabled>Poista kyytipyyntö</button>

<hr>

<h2>Kyytipyyntöni</h2>

<p id="kyytipyynto">Ei aktiivista kyytipyyntöä</p>

<p id="valittumaaranpaa"></p>

<p><b>Sijaintisi:</b></p>
<p id="sijainti">Haetaan sijaintia...</p>
<p id="viimeksipaivitetty"></p>

<button id="aloitatarjoaminen" onclick="aloitaTarjoaminen()">Aloita kyydin tarjoaminen</button>

<button id="lopetatarjoaminen" onclick="lopetaTarjoaminen()" disabled>Lopeta kyydin tarjoaminen</button>

<p id="tarjoajantila">En tarjoa kyytiä</p>

<p id="lahellaolevatpyynnot">Lähellä olevat kyytipyynnöt: 0</p>

<p id="havaittukyytipyynto"></p>

<script>

var nykyinenSijainti = "";
var kyytipyyntoAktiivinen = false;
var tallennettuMaaranpaa = "";
var tarjoaKyytia = false;
var tarjoaminenAloitettu = "";
    
navigator.geolocation.watchPosition(
    function(sijainti) {

        nykyinenSijainti =
            sijainti.coords.latitude + ", " +
            sijainti.coords.longitude;

        document.getElementById("sijainti").innerHTML =
            "Leveysaste: " + sijainti.coords.latitude +
            "<br>Pituusaste: " + sijainti.coords.longitude;
        document.getElementById("viimeksipaivitetty").innerHTML =
            "Viimeksi päivitetty: " + new Date().toLocaleTimeString();
    },
    function(virhe) {
        document.getElementById("sijainti").innerHTML =
            virhe.message;
    }
);

function naytaMaaranpaa() {

    if (kyytipyyntoAktiivinen) {
        return;
    }

    tallennettuMaaranpaa = document.getElementById("maaranpaa").value;

    document.getElementById("maaranpaa").value = "";

    document.getElementById("tallennanappi").disabled = true;
    
    document.getElementById("valittumaaranpaa").innerHTML =
        "Tallennettu määränpää: " +
        tallennettuMaaranpaa;

    document.getElementById("luonappi").disabled = false;
}

function luoKyytipyynto() {

    if (nykyinenSijainti == "") {
        document.getElementById("kyytipyynto").innerHTML =
            "Odottaa sijaintiasi.<br>Paina Luo kyytipyyntö -nappia pian uudestaan.";
        return;
    }
    
    var aika = new Date().toLocaleString();

    if (tallennettuMaaranpaa == "") {
        document.getElementById("kyytipyynto").innerHTML =
            "Anna ensin määränpää";
        return;
    }

    if (kyytipyyntoAktiivinen) {
        return;
    }

    kyytipyyntoAktiivinen = true;

    document.getElementById("kyytipyynto").innerHTML =
        "Lähtöpaikka: " + nykyinenSijainti +
        "<br>Määränpää: " +
        tallennettuMaaranpaa +
        "<br>Luotu: " + aika;

    document.getElementById("valittumaaranpaa").innerHTML = "";

    document.getElementById("poistanappi").disabled = false;
    
    document.getElementById("luonappi").disabled = true;

    document.getElementById("tallennanappi").disabled = true;

    document.getElementById("maaranpaa").disabled = true;
    
    }

function peruKyytipyynto() {

    document.getElementById("kyytipyynto").innerHTML =
        "Ei aktiivista kyytipyyntöä";

    document.getElementById("valittumaaranpaa").innerHTML = "";

    tallennettuMaaranpaa = "";

    document.getElementById("maaranpaa").value = "";

    kyytipyyntoAktiivinen = false;

    document.getElementById("tallennanappi").disabled = true;    

    document.getElementById("poistanappi").disabled = true;

    document.getElementById("luonappi").disabled = true;

    document.getElementById("maaranpaa").disabled = false;
    
}

function aloitaTarjoaminen() {
    tarjoaminenAloitettu = new Date().toLocaleTimeString();
    
    tarjoaKyytia = true;

    document.getElementById("lahellaolevatpyynnot").innerHTML =
    "Lähellä olevat kyytipyynnöt: 1";

    document.getElementById("tarjoajantila").innerHTML =
    "Tarjoan kyytiä<br>Aloitettu: " +
    tarjoaminenAloitettu;
    
    document.getElementById("aloitatarjoaminen").disabled = true;
}

    function lopetaTarjoaminen() {

    tarjoaKyytia = false;

    document.getElementById("tarjoajantila").innerHTML =
        "En tarjoa kyytiä";

    document.getElementById("aloitatarjoaminen").disabled = false;

    document.getElementById("lopetatarjoaminen").disabled = true;
}

</script>
