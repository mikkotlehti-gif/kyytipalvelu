/*

 */

async function etsiMaaranpaa() {

    const hakuteksti =
        document.getElementById(
            "maaranpaa"
        ).value.trim();
    
    const sisaltaaNumeron =
        /\d/.test(hakuteksti);
    
if (!sisaltaaNumeron) {

    document.getElementById(
        "maaranpaaHakutulokset"
    ).innerHTML =
        "Anna katuosoite ja numero, esimerkiksi Perkiöntie 12.";

    return;
}
    
    const perusVastaus =
        await fetch(
            "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=20&countrycodes=fi&q=" +
            encodeURIComponent(hakuteksti)
        );

    const perusTulokset =
        await perusVastaus.json();

    const hakutekstiPienella =
        hakuteksti.toLowerCase();

    const kadunnimiMukana =
        perusTulokset.some((tulos) => {

            const kadunnimi =
                tulos.address?.road;

            return (
                kadunnimi &&
                hakutekstiPienella.includes(
                    kadunnimi.toLowerCase()
                )
            );

        });

    let kaikkiTulokset =
        perusTulokset;

    if (!kadunnimiMukana) {

        const paakohteet = [
            "rautatieasema",
            "linja-autoasema",
            "keskusta"
        ];

        for (const paakohde of paakohteet) {

            await new Promise((resolve) =>
                setTimeout(resolve, 1100)
            );

            const vastaus =
                await fetch(
                    "https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&countrycodes=fi&q=" +
                    encodeURIComponent(
                        paakohde + " " + hakuteksti
                    )
                );

            const tulokset =
                await vastaus.json();

            kaikkiTulokset =
                kaikkiTulokset.concat(
                    tulokset
                );
        }
    }

    let html = "";

    const loydetytTulokset =
        new Set();

    kaikkiTulokset.forEach((tulos) => {

        const osoite =
            tulos.address || {};

        if (
            !osoite.road ||
            !osoite.house_number
        ) {
            return;
        }

        const katuosoite =
            osoite.road +
            " " +
            osoite.house_number;

        const kuntaTaiKaupunki =
            osoite.city ||
            osoite.town ||
            osoite.municipality ||
            osoite.village ||
            "";

        let osoiteTeksti = "";

        if (kadunnimiMukana) {

            osoiteTeksti =
                katuosoite +
                ", " +
                kuntaTaiKaupunki;

        } else {

            const kohteenNimi =
                tulos.name || "";

            osoiteTeksti =
                (kohteenNimi
                    ? kohteenNimi + ", "
                    : "") +
                katuosoite +
                ", " +
                kuntaTaiKaupunki;
        }

        if (
            loydetytTulokset.has(
                osoiteTeksti
            )
        ) {
            return;
        }

        loydetytTulokset.add(
            osoiteTeksti
        );

const koodattuOsoite =
    encodeURIComponent(
        osoiteTeksti
    );

html +=
    "<div style='margin-bottom: 8px;'>" +

    "<button class='luoKyytipyyntoHakutulos' onclick=\"valitseMaaranpaa(" +
    "decodeURIComponent('" +
    koodattuOsoite +
    "'), '" +
    tulos.lat +
    "', '" +
    tulos.lon +
    "')\">" +

    "Luo kyytipyyntö" +

    "</button> " +

    osoiteTeksti +

    "</div>";
        
    });

    document.getElementById(
        "maaranpaaHakutulokset"
    ).innerHTML =

        "Sopivia osoitteita ei löytynyt.";
}

async function haeMatkustajanMaaranpaanKoordinaatit() {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/search?format=json&q=" +
        encodeURIComponent(
            matkustajanMaaranpaa
        )
    );

    const tulokset =
        await vastaus.json();

    if (tulokset.length == 0) {

        alert(
            "Matkustajan määränpäätä ei löytynyt"
        );

        matkustajanMaaranpaaLatitude = null;

        matkustajanMaaranpaaLongitude = null;

        return false;

    }

    matkustajanMaaranpaaLatitude =
        parseFloat(
            tulokset[0].lat
        );

    matkustajanMaaranpaaLongitude =
        parseFloat(
            tulokset[0].lon
        );

    console.log(
        "Matkustajan määränpään koordinaatit:",
        matkustajanMaaranpaaLatitude,
        matkustajanMaaranpaaLongitude
    );

    return true;

}

async function haeMatkustajanLahtopaikanNimi(latitude, longitude) {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/reverse?format=json&lat=" +
        latitude +
        "&lon=" +
        longitude +
        "&addressdetails=1"
    );

    const tulos = await vastaus.json();

    const osoite = tulos.address;
    
    const tarkkaPaikka =
        (osoite.road || osoite.pedestrian || osoite.path || "") +
        (osoite.house_number ? " " + osoite.house_number : "");
    
    const kaupunkiTaiKunta =
        osoite.city ||
        osoite.town ||
        osoite.municipality ||
        osoite.village ||
        "";
    
    const lahtopaikanNimi =
        tarkkaPaikka + ", " + kaupunkiTaiKunta;
    
    return lahtopaikanNimi;
}

    
/*
 * Kyytipyynnön luonti
 */

async function luoKyytipyynto() {

    console.log(
        "luoKyytipyynto käynnistyi"
    );

    if (
        kayttajanNykyinenLatitude == null ||
        kayttajanNykyinenLongitude == null
    ) {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Odottaa sijaintiasi." +
            "<br>Yritä pian uudestaan.";

        return;
    }

    if (matkustajanMaaranpaa == "") {

        document.getElementById(
            "kyytipyynto"
        ).innerHTML =
            "Anna ensin määränpää";

        return;
    }

    if (kyytipyyntoAktiivinen) {
        return;
    }

    const matkustajanReitti =
        await laskeMatkustajanReitti();

    document.getElementById(
        "matkustajanReitti"
    ).innerHTML =
        "<b>Matka:</b> " +
        matkustajanReitti.matkaKm.toFixed(1) +
        " km" +
        "<br><b>Matka-aika:</b> " +
        matkustajanReitti.aikaMin.toFixed(0) +
        " min";

    const aika =
        new Date().toLocaleString();

    const lahtopaikanTiedot =
        await haeMatkustajanLahtopaikanNimi(
            kayttajanNykyinenLatitude,
            kayttajanNykyinenLongitude
        );

    const docRef = await addDoc(
        collection(
            db,
            "kyytipyynnot"
        ),
        {
            matkustajanLahtopaikka:
                lahtopaikanTiedot,

            matkustajanLahtopaikkaLatitude:
                kayttajanNykyinenLatitude,

            matkustajanLahtopaikkaLongitude:
                kayttajanNykyinenLongitude,

            matkustajanMaaranpaa:
                matkustajanMaaranpaa,

            matkustajanMaaranpaaLatitude:
                matkustajanMaaranpaaLatitude,

            matkustajanMaaranpaaLongitude:
                matkustajanMaaranpaaLongitude,

            luotu:
                new Date().toISOString(),

            status:
                "aktiivinen"
        }
    );

    firestoreKyytipyyntoId =
        docRef.id;

    kyytipyyntoAktiivinen =
        true;

    kuunteleOmaaKyytia();

const matkaAikaTunnit =
    Math.floor(
        matkustajanReitti.aikaMin / 60
    );

const matkaAikaMinuutit =
    Math.round(
        matkustajanReitti.aikaMin % 60
    );

document.getElementById(
    "kyytipyynto"
).innerHTML =
    "Lähtöpaikka: " +
    lahtopaikanTiedot +

    "<br>Määränpää: " +
    matkustajanMaaranpaa +
    " (" +
    matkustajanReitti.matkaKm.toFixed(1) +
    " km, " +
    matkaAikaTunnit +
    " h " +
    matkaAikaMinuutit +
    " min)" +

    "<br>Luotu: " +
    aika;

document.getElementById(
    "matkustajanReitti"
).innerHTML = "";

    document.getElementById(
        "valittumaaranpaa"
    ).innerHTML = "";

    document.getElementById(
        "poistanappi"
    ).disabled = false;

document.getElementById(
    "maaranpaa"
).disabled = true;

document.getElementById(
    "etsinappi"
).disabled = true;

document.getElementById(
    "maaranpaaHakutulokset"
).innerHTML = "";

}


/*
 * Kyytipyynnön poistaminen
 */

async function peruKyytipyynto() {

    if (unsubscribeOmaKyyti) {

        unsubscribeOmaKyyti();

        unsubscribeOmaKyyti = null;
    }

    if (firestoreKyytipyyntoId != "") {

        await deleteDoc(
            doc(
                db,
                "kyytipyynnot",
                firestoreKyytipyyntoId
            )
        );

        firestoreKyytipyyntoId = "";
    }

    document.getElementById(
        "kyytipyynto"
    ).innerHTML =
        "<b>Ei aktiivista kyytipyyntöä</b>";

    document.getElementById(
        "valittumaaranpaa"
    ).innerHTML = "";

    document.getElementById(
        "matkustajanReitti"
    ).innerHTML = "";

    document.getElementById(
        "kyytiSaapunut"
    ).innerHTML = "";

    document.getElementById(
        "maaranpaaHakutulokset"
    ).innerHTML = "";

    matkustajanMaaranpaa = "";
    matkustajanMaaranpaaLatitude = null;
    matkustajanMaaranpaaLongitude = null;

    valittuMaaranpaa = "";
    valittuMaaranpaaLatitude = null;
    valittuMaaranpaaLongitude = null;

    document.getElementById(
        "maaranpaa"
    ).value = "";

    kyytipyyntoAktiivinen = false;

    document.getElementById(
        "poistanappi"
    ).disabled = true;

    document.getElementById(
        "maaranpaa"
    ).disabled = false;

    document.getElementById(
        "etsinappi"
    ).disabled = true;
}

    if (autonTuntomerkki == "") {

    }

    noutomatkaRajaKm =
        parseFloat(
            document.getElementById(

            ).value
        );

    noutoaikaRajaMin =
        parseFloat(
            document.getElementById(
                "noutoaikaRajaMin"
            ).value
        );

    lisamatkaRajaKm =
        parseFloat(
            document.getElementById(
                "lisamatkaRajaKm"
            ).value
        );

    if (
        tarjoajanMaaranpaa == "" ||
        tarjoajanMaaranpaaLatitude == null ||
        tarjoajanMaaranpaaLongitude == null
    ) {

        alert(
            "Valitse ensin tarjoajan määränpää hakutuloksista"
        );

        return;
    }

    if (
        kayttajanNykyinenLatitude == null ||
        kayttajanNykyinenLongitude == null
    ) {

        alert(
            "Odotetaan tarjoajan sijaintitietoa"
        );

        return;
    }

    await laskeReittiAB();

    haeKyytipyynnot();

    tarjoaminenAloitettu =
        new Date().toLocaleTimeString();

    tarjoaKyytia =
        true;

    document.getElementById(
        "tarjoajantila"
    ).innerHTML =
        "Tarjoan kyytiä" +
        "<br>Aloitettu: " +
        tarjoaminenAloitettu;

    document.getElementById(
        "lopetatarjoaminen"
    ).disabled = false;

    document.getElementById(
        "autonTuntomerkki"
    ).disabled = true;

    document.getElementById(
        "tarjoajanMaaranpaa"
    ).disabled = true;

    document.getElementById(
        "etsiTarjoajanMaaranpaaNappi"
    ).disabled = true;

    document.getElementById(
        "noutomatkaRajaKm"
    ).disabled = true;

    document.getElementById(
        "noutoaikaRajaMin"
    ).disabled = true;

    document.getElementById(
        "lisamatkaRajaKm"
    ).disabled = true;

    document.getElementById(
        "tarjoajanMaaranpaaHakutulokset"
    ).innerHTML = "";
}

/*
 * Aktiivisten kyytipyyntöjen kuuntelu
 */

function haeKyytipyynnot() {

    const aktiivisetPyynnot = query(
        collection(
            db,
            "kyytipyynnot"
        ),
        where(
            "status",
            "==",
            "aktiivinen"
        )
    );

    unsubscribeKyytipyynnot = onSnapshot(
        aktiivisetPyynnot,

        async (snapshot) => {

            const pyyntojenLaskelmat =
                await Promise.all(

                    snapshot.docs.map(
                        async (docSnapshot) => {

                            const pyynto =
                                docSnapshot.data();

                            const reittiAC =
                                await laskeReittiAC(
                                    pyynto
                                );

                            const reittiACDB =
                                await laskeReittiACDB(
                                    pyynto
                                );

                            const lisamatkaKm =
                                reittiACDB.matkaKm -
                                reittiABMatkaKm;

                            const lisaaikaMin =
                                reittiACDB.aikaMin -
                                reittiABAikaMin;

                            return {
                                id:
                                    docSnapshot.id,

                                pyynto:
                                    pyynto,

                                reittiAC:
                                    reittiAC,

                                reittiACDB:
                                    reittiACDB,

                                lisamatkaKm:
                                    lisamatkaKm,

                                lisaaikaMin:
                                    lisaaikaMin
                            };
                        }
                    )
                );

            const suodatetutPyynnot =
                pyyntojenLaskelmat.filter(
                    (laskelma) => {

return (
    laskelma.reittiAC.matkaKm <=
        noutomatkaRajaKm &&

    laskelma.reittiAC.aikaMin <=
        noutoaikaRajaMin &&

    laskelma.lisamatkaKm <=
        lisamatkaRajaKm
);
                    }
                );

            document.getElementById(
                "lahellaolevatpyynnot"
            ).innerHTML =
                "Sopivia kyytipyyntöjä: " +
                suodatetutPyynnot.length;

            let html = "";

            suodatetutPyynnot.forEach(
                (laskelma) => {

                    const pyynto =
                        laskelma.pyynto;

html += `
    <hr>

    <b>Lähtöpaikka:</b>
    ${pyynto.matkustajanLahtopaikka}

<br><b>Määränpää:</b>
${pyynto.matkustajanMaaranpaa}

<br><b>Lähtöpisteeseen:</b>

${laskelma.reittiAC.matkaKm.toFixed(1)} km /
${laskelma.reittiAC.aikaMin.toFixed(0)} min

                        <br><b>Luotu:</b>
                        ${new Date(
                            pyynto.luotu
                        ).toLocaleString()}

                        <br><b>Status:</b>
                        ${pyynto.status}

                        <br><b>A→C→D→B:</b>
                        ${laskelma.reittiACDB.matkaKm.toFixed(1)}
                        km /
                        ${laskelma.reittiACDB.aikaMin.toFixed(0)}
                        min

                        <br><b>Lisämatka: +
                        ${laskelma.lisamatkaKm.toFixed(1)}
                        km</b>

                        <br><b>Lisäaika: +
                        ${laskelma.lisaaikaMin.toFixed(0)}
                        min</b>

                        <br>

                        <button onclick="olenPaikalla('${laskelma.id}')">
                            Olen paikalla
                        </button>

                        <br>
                    `;
                }
            );

            document.getElementById(
                "havaittukyytipyynto"
            ).innerHTML =
                html;
        }
    );
}


/*

async function olenPaikalla(id) {

    await updateDoc(

        doc(
            db,
            "kyytipyynnot",
            id
        ),

        {
            status:
                "tarjoaja_paikalla",

            autonTuntomerkki:
                autonTuntomerkki
        }

    );

}


/*
 * Matkustajan oman kyytipyynnön kuuntelu
 */

function kuunteleOmaaKyytia() {

    if (firestoreKyytipyyntoId == "") {
        return;
    }

    unsubscribeOmaKyyti = onSnapshot(

        doc(
            db,
            "kyytipyynnot",
            firestoreKyytipyyntoId
        ),

        (snapshot) => {

            if (!snapshot.exists()) {
                return;
            }

            const pyynto =
                snapshot.data();

            if (
                pyynto.status ==
                "tarjoaja_paikalla"
            ) {

                document.getElementById(
                    "kyytiSaapunut"
                ).innerHTML =
                    "🚕 Kyyti on saapunut" +

                    "<br><b>Auton tuntomerkki:</b> " +
                    pyynto.autonTuntomerkki +

                    "<br>" +

                    "<button onclick='hylkaaKyyti()'>" +
                    "Hylkää kyyti" +
                    "</button>";

            } else {

                document.getElementById(
                    "kyytiSaapunut"
                ).innerHTML = "";

            }

        }

    );

}

/*
 * Tarjoajan määränpään geokoodaus
 */

async function haeTarjoajanMaaranpaanKoordinaatit() {

    const vastaus = await fetch(
        "https://nominatim.openstreetmap.org/search?format=json&q=" +
        encodeURIComponent(
            tarjoajanMaaranpaa
        )
    );

    const tulokset =
        await vastaus.json();

    if (tulokset.length == 0) {

        alert(
            "Tarjoajan määränpäätä ei löytynyt"
        );

        tarjoajanMaaranpaaLatitude = null;

        tarjoajanMaaranpaaLongitude = null;

        return false;

    }

    tarjoajanMaaranpaaLatitude =
        parseFloat(
            tulokset[0].lat
        );

    tarjoajanMaaranpaaLongitude =
        parseFloat(
            tulokset[0].lon
        );

    document.getElementById(
        "tarjoajanKoordinaatit"
    ).innerHTML =
        "<b>Tarjoajan määränpään koordinaatit</b>" +
        "<br>Lat: " +
        tarjoajanMaaranpaaLatitude +
        "<br>Lon: " +
        tarjoajanMaaranpaaLongitude;

    console.log(
        "Tarjoajan määränpään koordinaatit:",
        tarjoajanMaaranpaaLatitude,
        tarjoajanMaaranpaaLongitude
    );

    return true;

}


/*
 * Tarjoajan normaali reitti A → B
 */

async function laskeReittiAB() {

    const url =
        "https://router.project-osrm.org/route/v1/driving/" +

        kayttajanNykyinenLongitude +
        "," +
        kayttajanNykyinenLatitude +

        ";" +

        tarjoajanMaaranpaaLongitude +
        "," +
        tarjoajanMaaranpaaLatitude +

        "?overview=false";

    const vastaus =
        await fetch(url);

    const data =
        await vastaus.json();

    reittiABMatkaKm =
        data.routes[0].distance /
        1000;

    reittiABAikaMin =
        data.routes[0].duration /
        60;
    
    document.getElementById(
        "reittiAB"
    ).innerHTML =
        "<b>Reitti A → B</b>" +
        "<br>Matka: " +
        reittiABMatkaKm.toFixed(1) +
        " km" +
        "<br>Aika: " +
        reittiABAikaMin.toFixed(0) +
        " min";

}
